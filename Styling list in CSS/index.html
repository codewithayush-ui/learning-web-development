<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling CSS</title>
    <style>
        nav ul li{
            list-style: devanagari; /*changes the style of the list or can say the way of listing the list */
            background-color: yellow;
            list-style-position: inside; /*it includes the list with the content and applys the thingd that are applied to the list content */
            border: 2px solid black;
            /* list-style-image: url("https://assets.bytebytego.com/diagrams/0408-what-is-css-cascading-style-sheets.png"); this works when image is put in the form of jpeg or png */
            list-style: disc inside ; /*this is to include the disc as the point and also inside it */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
