<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="image.png" alt="train image"><!--alt function is used to get the name of the image if there is some error-->
    <h1>Inserting mages and lists etc</h1><!-- creates heading and as we increase the number in h1 and h2 and h3 etc... we get smaller heading-->
    <p>this is the para i am using to define the image 
        <a target="_blank"href="http://www.google.com">link to find more trains</a><!-- in herf we put link , and in target we use _blank by clicking on the link to open in another tab-->
    </p><!--use lorem function in para to get random words and put number in front of it to get desired number of words-->
    <br><!-- creates a line break and create distance and space just like shift+enter-->
    <table>
        <caption>Employee details</caption><!-- to create caption-->

        <thead><!--to create the header-->
            header
        </thead>
        <tfoot><!--to create the footer-->
            footer
        </tfoot>
        <tr><!-- we are making different tr to get different rows-->
            <th>name</th><!-- to create headings to which we relate the differnt rows and things accordingly-->
            <th>Designation</th>
        </tr>

        <tr>
            <td colspan="2">sam</td> <!--here we can use colspan to decide how much space we are giving to the table row -->
            <td rowspan="1">programmer</td><!-- and can use rowspan to give more than one row to single element -->
        </tr>
        <tr>
            <td colspan="2">Raju</td> 
            <td >Teacher</td>
        </tr>
    </table>

    <ul type="square"><!--this is a unordered list--><!-- by putting type = we can customise the type of vullet points -->
        <li>ayush</li><!--li for putting list-->
        <li>vinay</li>
        <li>awanish</li>
    </ul>
    <ol type="A"><!--this creates a ordered list with numbers, by putting type we can change it from numbers to alphabets etc.-->
        <li>Ayush</li><!-- creates listd and words in the list-->
        <li>neelam</li>
        <li>JJ</li>
    </ol>
</body>
</html>
