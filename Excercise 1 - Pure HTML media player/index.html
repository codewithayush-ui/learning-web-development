<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise 1 - Pure HTML Media player</title>
</head>
<body>
    <!-- Question - You are given 12 files; 6 audio and video 
    Design a website using HTML only which shows these 12 files
    1.mp3, 2.mp3 ..... 6.mp3
    1.mp4, 2.mp4 ..... 6.mp4-->
    <!-- use of nav is wrong here i should have used section then div -->
        <!-- nav is used for the things like head , bosy etc -->
         <h1>THESE ARE AUDIO FILES</h1>
    <section>
        <audio src="" controls>1.mp3</audio><br><br><!-- using double br i can put all the audios and videos in a vertical line-->
        <audio src="" controls>2.mp3</audio><br><br>
        <audio src="" controls>3.mp3</audio><br><br>
        <audio src="" controls>4.mp3</audio><br><br>
        <audio src="" controls>5.mp3</audio><br><br>
        <audio src="" controls>6.mp3</audio><br><br>
    </section>
    
    <div>
    <h1>THESE ARE VIDEO FILES</h1>
    <section>
             <video src="" controls>1.mp4</video><br><br>
            <video src="" controls>2.mp4</video><br><br>
            <video src="" controls>3.mp4</video><br><br>
            <video src="" controls>4.mp4</video><br><br>
            <video src="" controls>5.mp4</video><br><br>
            <video src="" controls>6.mp4</video><br><br>
     </section>
        
    </div>
</body>
</html>
