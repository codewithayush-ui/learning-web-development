<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise -4 </title>
    <style>
         @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');
    </style>
    <style>
        :root{
            --color: rgb(226, 26, 226);
            --secolor: rgb(202, 137, 201);
            --textcolor: white;
        }
       *{
        margin: 0;
        padding: 0;
        font-family: "DM Sans", sans-serif;
       }
       body{
        background-color: var(--secolor);
       }
       nav{
        background-color: var(--color);
        padding: 20px;
       }
       ul li{
        list-style: none;
        display: inline;
        padding: 23px;
        font-weight: bolder;
       }
       ul li a{
        text-decoration: none; 
        color: var(--textcolor);
       }
    </style>
</head>
<body>
    <!-- to design a nav bar and make a style sheet with global variable , and due to which the colour of the contrast will change
     , making a mult color nav bar  -->
     <nav>
        <ul>
            <li><a href="/">Home</li></a>
            <li><a href="/">About</li></a>
            <li><a href="/">Service</li></a>
            <li><a href="/">Contact us</li></a>
        </ul>
     </nav>
</body>
</html>
