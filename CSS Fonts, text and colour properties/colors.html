<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        /* there are sometimes many colors which are not available so we use the color keyword usig a link from google then just writing the same color keyword to get the desiered color  */
        h1{
          /* using color keyword */
            /* color: red; */
            /* using hex color  */
            /* color: #80ff00 we use hex codes to get particular colors */
            /* color: rgb(rgb(201, 18, 18), green, blue) */
            /* we can write numbers from 0 -255 for three of them to get diffrent color combinations */
            /* color: rgba(red, green, blue, alpha) */
            /* alpha is the opacity of the colour  */
            color: hsl(hue, saturation, lightness)
            /* we get diffrent colours for diffrent values of H , S and l */
            /* similarly for the background color we can put diffrent values  */
        }  
    </style>
</head>
<body>
    <h1>Lets learn about colors</h1>
    <p>
        Colors can be represented in:
        <ol>
            <li>Color keyword</li>

            <li>HSL</li>
        </ol>
    </p>
