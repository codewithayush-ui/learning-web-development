<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Layout</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background-color: black;
}

/* Navbar */

.first{
    background-color: violet;
    height: 70px;

    position: sticky;
    top: 0;
}

/* Main Section */

.second{
    background-color: green;
    margin: 20px;
    padding: 40px;

    display: flex;
    justify-content: space-around;
}

/* Left Box */

.one{
    background-color: pink;
    height: 300px;
    width: 300px;
}

/* Right Box */

.two{
    background-color: skyblue;
    height: 300px;
    width: 300px;
}

/* Welcome Box */

.box{
    color: white;

    border: 2px solid white;

    width: 60%;
    margin: 40px auto;

    padding: 30px;

    text-align: center;

    border-radius: 40px;

    font-size: 30px;
}

/* Circle */

.circle{
    background-color: orange;

    height: 60px;
    width: 60px;

    border-radius: 50%;

    position: fixed;

    right: 20px;
    bottom: 20px;
}

/* Footer */

.footer{
    background-color: white;
    height: 70px;
}

</style>
</head>

<body>

<div class="first"></div>

<div class="second">

    <div class="one"></div>

    <div class="two"></div>

</div>

<div class="box">
    Welcome to this Sigma Web Development Express
</div>

<div class="circle"></div>

<div class="footer"></div>

</body>
</html>
