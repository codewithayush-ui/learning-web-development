<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            height: 113px;
            width: 80vw;
            margin: 3px;
            padding: 2px;
        }
        .box1{
            background-color: aqua;
            /* position: relative;
            z-index: 1; */
            /* position: absolute;
            top: 0px;
            left: 0px; */
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;

        }
        .box2{
            background-color: aliceblue;
            position: relative;
            top: 54px;
            left: 24px;

        }
        .box3{
            background-color: bisque;
            /* position: fixed; */
        }
        .box4{
            background-color: purple;
            
        }
        .parent{
            border: 3px solid violet;
            margin: 30px;
            padding: 24px;
            /* position: absolute; */
            height: 150vh;
            transform: translate(0);
        }

    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
     <div class="box box3"></div>
     <div class="box box4"></div>
     </div>
</body>
</html>
